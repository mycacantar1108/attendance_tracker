<style>


.calendar-entries{display:flex;flex-direction:column;gap:9px;max-height:320px;overflow:auto;margin:14px 0}
.calendar-entry{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.65)}
.calendar-entry-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#fff0f5;flex:0 0 auto}
.calendar-entry-content{display:flex;flex-direction:column;gap:3px;min-width:0}
.calendar-entry-type{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#e64a75;font-weight:750}
.calendar-entry-content b{font-size:14px}
.calendar-entry-content small{font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.calendar-empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px;line-height:1.5}
.cal-cell.has-items{position:relative}
.cal-cell.has-items .date-dot{position:absolute;right:6px;bottom:5px;width:6px;height:6px;border-radius:50%;background:#ee4f7d;box-shadow:0 0 0 3px rgba(238,79,125,.12)}
.day-logged{border:1px solid var(--line);border-radius:15px;padding:10px;margin:10px 0;background:rgba(255,255,255,.55)}
.day-logged>b{font-size:12px;color:var(--muted)}
.day-log-row{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line);margin-top:7px}
.day-log-row>span{width:26px;height:26px;display:grid;place-items:center;border-radius:9px;background:#fff0f5}
.day-log-row div{display:flex;flex-direction:column;gap:2px}
.day-log-row small{font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word}


.entry-actions{display:flex;gap:8px;margin-top:7px}
.entry-actions button{border:0;border-radius:9px;padding:6px 10px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.entry-edit{background:#f7eafa;color:#7b57a6}
.entry-delete{background:#fff0f3;color:#d94168}
.entry-actions button:active{transform:scale(.97)}


.schedule-adjust-btn{font-weight:800!important}
.cal-cell.skipped .skip-label{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:5.5px;letter-spacing:.03em;font-weight:900;white-space:nowrap}


.skip-modal .skip-question{font-size:14px;margin:8px 0 14px}
.skip-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.skip-options button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 9px;text-align:left;font-weight:800;cursor:pointer}
.skip-options button:active{transform:scale(.98)}


.pause-day-btn,.skip-day-btn{font-weight:850!important}
.cal-cell.skipped .skip-label{font-size:5.5px!important;font-weight:900!important}


.cal-cell.skipped{background:#eee9ef!important;color:#8d8290!important;border:2px dashed #aaa0ad!important;position:relative}
.cal-cell.skipped .pause-mark{position:absolute;right:4px;top:3px;font-size:12px}
.cal-cell.skipped .skip-label{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);font-size:5px;font-weight:900;letter-spacing:.02em;white-space:nowrap}
.calendar-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--muted);font-weight:700}
.legend-pause{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#8d8290;color:#fff;font-style:normal;font-size:9px}

/* v1.2 polish */
body{letter-spacing:-.01em}
.header{align-items:center}

.quick-add{position:fixed;right:24px;bottom:104px;width:310px;background:var(--card,#fff);border:1px solid var(--line);border-radius:22px;padding:10px;box-shadow:0 20px 50px rgba(55,35,60,.20);z-index:1000;display:none}

.quick-add-item:hover{background:#fff1f6}
.quick-add-item:active{transform:scale(.99)}
.qa-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#fff0f5;font-size:18px;flex:0 0 34px}
.quick-add-item span:last-child{display:flex;flex-direction:column;gap:2px}.quick-add-item small{color:var(--muted);font-size:12px}
@keyframes qaIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.dark .quick-add-item:hover{background:#2a2029}

.today-kicker{font-size:15px;font-weight:700;color:#e64a75;text-transform:uppercase;letter-spacing:.08em}.today-title{font-size:26px;font-weight:750;margin-top:3px}.today-copy{color:var(--muted);margin-top:5px}.today-action{border:0;border-radius:16px;background:#ee4f7d;color:white;padding:13px 19px;font-weight:700;cursor:pointer;white-space:nowrap}.today-action span{font-size:20px;margin-left:5px}

@media(max-width:620px){.today-card{padding:18px;align-items:flex-start}.today-title{font-size:20px}.today-copy{font-size:14px}.today-action{padding:10px 12px}.calendar-nav .badge{font-size:13px;padding:8px 10px}.month-arrow{width:34px;height:34px;font-size:24px}}
:root{
  --bg:#fff8fc; --card:#fff; --ink:#171827; --muted:#706c87;
  --line:#f0e2ed; --pink:#ee4f7d; --pink2:#f68bab; --pink-soft:#fff0f5;
  --purple:#9270e8; --purple-soft:#f3edff; --shadow:0 12px 34px rgba(196,91,139,.10);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#fffafd 0%,#fff8fc 55%,#faf7ff 100%)}
button{font:inherit}
.app{max-width:1024px;margin:auto;padding:28px 30px 132px}
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}
h1{font-size:46px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-1.8px}
.subtitle{font-size:22px;color:var(--muted);margin-top:16px}
.top-actions{display:flex;gap:24px;padding-top:5px}
.icon-btn{border:0;background:transparent;color:#303047;cursor:pointer;padding:4px}
.icon-btn svg{width:34px;height:34px;stroke-width:1.9}
.dashboard{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr;align-items:center;background:rgba(255,255,255,.70);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:42px 22px;margin-bottom:24px}

.ring{width:190px;height:190px;position:relative;flex:none}

.ring .track{fill:none;stroke:#f7e8f0;stroke-width:7}

.schedule-head{display:flex;align-items:center;justify-content:space-between;padding:30px}

.badge{background:#fff0f4;color:#e6426f;padding:13px 22px;border-radius:28px;font-size:20px}
.rows{padding:0 22px 28px}
.row{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:20px;min-height:78px;margin-top:12px;padding:10px 20px;display:flex;align-items:center;gap:22px;cursor:pointer;transition:.16s;box-shadow:0 4px 14px rgba(211,132,171,.05)}

.date{font-size:24px;flex:1}.date b{font-weight:700}.date span{font-weight:400;color:#171827}

.row.done{background:#fff8fb;border-color:#f3c6d7}.row.done .check{background:#ee4f7d;border-color:#ee4f7d}.row.done .check:after{content:"✓";font-size:23px;font-weight:700}.row.done .num{background:#ffe1ea}
.fab{position:fixed;right:max(24px,calc((100vw - 1024px)/2 + 22px));bottom:88px;width:76px;height:76px;border:0;border-radius:50%;background:linear-gradient(145deg,#f35b87,#ee3f76);color:#fff;box-shadow:0 16px 34px rgba(238,63,118,.30);display:grid;place-items:center;cursor:pointer;z-index:20}

.bottom-inner{max-width:1024px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:12px 18px 10px}
.nav-btn{border:0;background:transparent;color:#6e6982;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;cursor:pointer}.nav-btn svg{width:31px;height:31px}.nav-btn span{font-size:17px}.nav-btn.active{color:#ee4f7d}
.panel{display:none}.panel.active{display:block}
.overlay{position:fixed;inset:0;background:rgba(30,25,40,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.overlay.show{display:flex}
.modal{width:min(520px,100%);background:#fff;border-radius:24px;padding:25px;box-shadow:0 25px 80px rgba(30,25,40,.25)}.modal h3{margin:0 0 10px;font-size:25px}.modal p{color:var(--muted);line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.modal button{border:0;border-radius:12px;padding:11px 17px;cursor:pointer}.primary{background:#ee4f7d;color:#fff}.secondary{background:#f5edf2;color:#5e586c}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:14px;padding:13px;resize:vertical;outline:none;font:inherit}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.stat b{font-size:28px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-cell{padding:9px 4px;text-align:center;border-radius:10px}.cal-cell.head{font-size:12px;color:var(--muted)}.cal-cell.hit{background:#fff0f4;color:#e64673;font-weight:700}.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}

@media(max-width:900px){
 .app{padding:24px 18px 132px}h1{font-size:36px}.subtitle{font-size:18px}.dashboard{grid-template-columns:1fr 1fr;padding:24px}.metric{padding:18px}.metric+.metric{border-left:0}.progress-wrap{grid-column:1/-1;justify-content:center}.ring{width:165px;height:165px}

function compressImageFile(file,maxSize=900,quality=.78){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSize/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve({data:c.toDataURL("image/jpeg",quality),name:file.name});};img.onerror=reject;img.src=r.result;};r.onerror=reject;r.readAsDataURL(file);});}

function dateFor(day){

   const iso=isoDate(d);
   if(weekday!==0 && weekday!==6 && !isSkippedDate(iso)) count++;

function pauseDate(iso){
 const d=new Date(iso+"T00:00:00");
 if(d.getDay()===0||d.getDay()===6){
   showModal("Weekend excluded","Saturday and Sunday are already excluded from your 55 training days.");
   return;
 }
 if(isSkippedDate(iso)) return;
 const before=trainingDays();
 // Preserve any existing day notes by their actual calendar date before IDs shift.
 const notesByDate={};
 before.forEach(x=>{
   const note=localStorage.getItem("bloom55.note."+x.id)||"";
   if(note.trim()) notesByDate[isoDate(x.date)]=note;
 });
 setSkippedDates([...getSkippedDates(),iso]);
 Object.entries(notesByDate).forEach(([date,note])=>{
   const fresh=trainingDayForDate(date);
   if(fresh) localStorage.setItem("bloom55.note."+fresh.id,note);
 });
 preserveCompletedAcrossSkip(before);
 render();
 openCalendarDate(iso);
}
function restoreDate(iso){
 const before=trainingDays();
 setSkippedDates(getSkippedDates().filter(x=>x!==iso));
 preserveCompletedAcrossSkip(before);
 render();
 openCalendarDate(iso);
}
function scheduleStatus(iso){
 try{return JSON.parse(localStorage.getItem("bloom55.scheduleAdjustments")||"{}")[iso]||null}catch(e){return null}
}
function setScheduleStatus(iso,type,reason){
 const all=JSON.parse(localStorage.getItem("bloom55.scheduleAdjustments")||"{}");
 all[iso]={type,reason:reason||"",updatedAt:new Date().toISOString()};
 localStorage.setItem("bloom55.scheduleAdjustments",JSON.stringify(all));
}
function scheduleStatusLabel(iso){
 const x=scheduleStatus(iso);
 return x?.type==="holiday"?"HOLIDAY":x?.type==="noclass"?"NO CLASS":x?.type==="suspended"?"SUSPENDED":x?.type==="paused"?"PAUSED":x?.type==="rescheduled"?"RESCHEDULED":"PAUSED";
}
function skipReasonPrompt(iso){
 const o=document.getElementById("overlay");
 const existing=scheduleStatus(iso);
 o.innerHTML=`<div class="modal">
   <div class="modal-kicker">Pause Training Day</div>
   <h3>Skip ${iso}?</h3>
   <p>This date will not count as one of your 55 actual training days. The remaining schedule will move forward automatically.</p>
   <label class="field-label">Reason
     <select id="pauseReason">
       <option value="holiday">🎉 Holiday</option>
       <option value="noclass">🚫 No Class</option>
       <option value="suspended">⏸ Class Suspended</option>
       <option value="paused">⏸ Other / Paused</option>
     </select>
   </label>
   <label class="field-label">Note (optional)
     <textarea id="pauseNote" placeholder="Why was there no class?">${escHtml(existing?.reason||"")}</textarea>
   </label>
   <div class="modal-actions">
    <button type="button" class="secondary" id="cancelPause">Cancel</button>
    <button type="button" class="primary" id="confirmPause">⏸ Pause Day</button>
   </div>
 </div>`;
 addModalCloseX(o);o.classList.add("show");
 if(existing?.type) document.getElementById("pauseReason").value=existing.type;
 document.getElementById("cancelPause").onclick=()=>openCalendarDate(iso);
 document.getElementById("confirmPause").onclick=()=>{
   setScheduleStatus(iso,document.getElementById("pauseReason").value,document.getElementById("pauseNote").value);
   pauseDate(iso);
 };
}
function streak(){
 let n=0;
 for(let i=TOTAL;i>=1;i--){
   if(completed.has(i)){ n++; } else if(n>0){ break; }
 }
 return n;
}
function longestStreak(){
 let best=0,n=0;
 for(let i=1;i<=TOTAL;i++){
   if(completed.has(i)){ n++; best=Math.max(best,n); }
   else n=0;
 }
 return best;
}
function todayTrainingDay(){
 const today = new Date();
 today.setHours(0,0,0,0);
 const match = trainingDays().find(d => d.date.getTime() === today.getTime());
 return match || null;
}
function save(){ localStorage.setItem(KEY,JSON.stringify([...completed].sort((a,b)=>a-b))); localStorage.setItem(NOTES_KEY,notes); }
function setTheme(){
  document.documentElement.classList.toggle("dark",dark);
  document.body.classList.toggle("dark",dark);
  document.documentElement.classList.toggle("night",dark);
  document.body.classList.toggle("night",dark);
  localStorage.setItem("bloom55.dark",dark?"1":"0");
}
function ringSvg(percent){
 const r=42,c=2*Math.PI*r,offset=c*(1-percent/100);
 return `<svg viewBox="0 0 100 100"><defs><linearGradient id="grad"><stop offset="0%" stop-color="#f8b4d9"/><stop offset="100%" stop-color="#f59fcb"/></linearGradient></defs><circle class="track" cx="50" cy="50" r="${r}"/><circle class="value" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/></svg>`;
}
function dashboard(){
 const pct=Math.round(completed.size/TOTAL*100);
 const end=dateFor(TOTAL);
 return `<section class="dashboard">
   <div class="metric progress-wrap"><div class="ring">${ringSvg(pct)}<div class="ring-center"><div class="percent">${pct}<small>%</small></div><div class="ring-label">Progress</div></div></div></div>
   <div class="metric"><div class="metric-title">Completed</div><div class="big"><span class="pink">${completed.size}</span> / ${TOTAL} <span class="muted" style="font-size:22px;font-weight:500">days</span></div></div>
   <div class="metric"><div class="streak-box"><div class="metric-icon fire">${icon.flame}</div><div><div class="metric-title">Current Streak</div><div class="big pink">${streak()} days</div><div class="helper">Keep it going!</div></div></div></div>
   <div class="metric"><div class="end-box"><div class="metric-icon cal">${icon.cal}</div><div><div class="metric-title">End Date</div><div class="big" style="font-size:21px">${fmt(end,false)}</div><div class="helper">55 training days</div></div></div></div>
 </section>`;
}
function todayCard(){
 const todayDay=todayTrainingDay();
 const next=trainingDays().find(d=>!completed.has(d.id));
 const target=todayDay || next;
 if(!target) return "";
 const done=completed.has(target.id);
 const title=todayDay ? (done ? "Today’s training is complete!" : "Today’s Training") : "Next Training Day";
 const sub=todayDay ? fmt(target.date,false) : `Day ${target.id} • ${fmt(target.date,false)}`;
 return `<section class="today-card">
   <div><div class="today-kicker">${title}</div><div class="today-title">${sub}</div><div class="today-copy">${done ? "Great work. Keep your momentum going! 💜" : "Ready to train? Your next session is waiting."}</div></div>
   <button class="today-action" data-day="${target.id}">${done ? "View Day" : "Start Training"} <span>→</span></button>
 </section>`;
}
function schedule(){
 const days=trainingDays();
 const weeks=[];
 for(let i=0;i<days.length;i+=5) weeks.push(days.slice(i,i+5));
 if(scheduleWeekIndex<0)scheduleWeekIndex=0;
 if(scheduleWeekIndex>=weeks.length)scheduleWeekIndex=weeks.length-1;
 const week=weeks[scheduleWeekIndex]||[];
 const first=week[0]?.date,last=week[week.length-1]?.date;
 const range=first&&last?`${first.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – ${last.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`:"";
 const completedInWeek=week.filter(d=>completed.has(d.id)).length;
 const weekHtml=`<div class="week-summary"><div><div class="week-title">WEEK ${scheduleWeekIndex+1}</div><div class="week-range">${range}</div></div><div class="week-count">${completedInWeek}/${week.length} complete</div></div>
   <div class="week-days">${week.map(d=>`<button class="week-day ${completed.has(d.id)?"done":""}" data-day="${d.id}" data-detail="${d.id}"><div class="weekday">${d.date.toLocaleDateString("en-US",{weekday:"short"})}</div><div class="full-date">${d.date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div><div class="status">✓</div></button>`).join("")}</div>
   <div class="week-controls"><button type="button" id="prevWeek" ${scheduleWeekIndex===0?"disabled":""}>‹ Previous</button><div class="week-position">Week ${scheduleWeekIndex+1} of ${weeks.length}</div><button type="button" id="nextWeek" ${scheduleWeekIndex===weeks.length-1?"disabled":""}>Next ›</button></div>`;
 const listHtml=`<div class="list-mode ${scheduleView==='list'?'show':''}"><div class="rows">${days.map(d=>`<button class="row ${completed.has(d.id)?"done":""}" data-day="${d.id}" data-detail="${d.id}"><div class="num">${d.date.toLocaleDateString("en-US",{weekday:"short"})}</div><div class="date"><b>${d.date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</b></div><div class="check"></div></button>`).join("")}</div></div>`;
 return `<section class="schedule"><div class="schedule-head"><div class="schedule-title"><div class="head-icon">${icon.cal}</div>Training Schedule</div><div class="badge">Upcoming</div></div><div class="schedule-week-wrap"><div class="schedule-switch"><button type="button" id="weekViewBtn" class="${scheduleView==='week'?'active':''}">▦ By Week</button><button type="button" id="listViewBtn" class="${scheduleView==='list'?'active':''}">☷ By List</button></div><div class="week-mode ${scheduleView==='week'?'':'hide'}">${weekHtml}</div>${listHtml}</div></section>`;
}
function progressPanel(){
 const pct=Math.round(completed.size/TOTAL*100);
 const done=[...completed].sort((a,b)=>a-b);
 return `<section class="schedule panel active"><div class="schedule-head"><div class="schedule-title"><div class="head-icon">${icon.chart}</div>Progress</div><div class="badge">${pct}% Complete</div></div><div style="padding:24px"><div class="stat-grid"><div class="stat"><div class="muted">Completed</div><b>${completed.size}</b><span class="muted"> / 55</span></div><div class="stat"><div class="muted">Current streak</div><b class="pink">${streak()}</b><span class="muted"> days</span></div><div class="stat"><div class="muted">Longest streak</div><b>${longestStreak()}</b><span class="muted"> days</span></div><div class="stat"><div class="muted">Remaining</div><b>${TOTAL-completed.size}</b><span class="muted"> days</span></div></div><div style="margin-top:18px" class="empty-state">${done.length?`Completed days: ${done.join(", ")}`:"No training days completed yet. Tap a circle on the Schedule to start."}</div></div></section>`;
}
function notesPanel(){
 return `<section class="schedule panel active"><div class="schedule-head"><div class="schedule-title"><div class="head-icon">${icon.note}</div>Notes</div><div class="badge">Saved locally</div></div><div style="padding:24px"><textarea id="notesBox" placeholder="Write your training notes here...">${notes}</textarea><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="primary" id="saveNotes">Save Notes</button></div></div></section>`;
}

function getQuickAdds(){
 try{return JSON.parse(localStorage.getItem("bloom55.quickAdds")||"[]")}catch(e){return []}
}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function trainingDayForDate(iso){return trainingDays().find(d=>isoDate(d.date)===iso)||null}
function calendarEntriesForDate(iso){
 const out=[];
 const day=trainingDayForDate(iso);
 const status=scheduleStatus(iso);
 if(status) out.push({type:"schedule",title:scheduleStatusLabel(iso),value:status.reason||"Training day paused",_schedule:true});
 if(day){
   const dayNote=localStorage.getItem("bloom55.note."+day.id)||"";
   if(dayNote.trim()) out.push({type:"note",title:`Day ${day.id} note`,value:dayNote,_dayNote:true,dayId:day.id});
 }
 return out.concat(getQuickAdds().filter(x=>x.date===iso));
}
function escHtml(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function entryIcon(type){return {attendance:"✓",activity:"📋",note:"📝",requirement:"📎",date:"📅",schedule:"⏸️"}[type]||"•"}
function entryLabel(type){return {attendance:"Attendance",activity:"Training Activity",note:"Note",requirement:"Requirement / Assignment",date:"Important Date / Event",schedule:"Schedule Change"}[type]||"Entry"}
function openCalendarDate(iso){
 const o=document.getElementById("overlay");
 const entries=calendarEntriesForDate(iso);
 const d=new Date(iso+"T00:00:00");
 const day=trainingDayForDate(iso);
 const skipped=isSkippedDate(iso);
 const status=scheduleStatus(iso);
 const label=d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
 const list=entries.length ? entries.map((x,i)=>`
   <div class="calendar-entry">
    <div class="calendar-entry-icon">${entryIcon(x.type)}</div>
    <div class="calendar-entry-content">
     <div class="calendar-entry-type">${entryLabel(x.type)}</div>
     <b>${escHtml(x.title||entryLabel(x.type))}</b>
     ${x.value?`<small>${escHtml(x.value)}</small>`:""}
     ${x.attachmentName?`<a class="calendar-entry-attachment" href="${x.attachmentData||"#"}" ${x.attachmentData?`download="${escHtml(x.attachmentName)}" target="_blank"`:``}>📎 ${escHtml(x.attachmentName)}</a>`:""}
     ${x._schedule?"<small>This date is excluded from the 55 training-day count.</small>":""}
     ${!x._schedule?`<div class="entry-actions"><button type="button" class="entry-edit" data-entry-index="${i}">Edit</button><button type="button" class="entry-delete" data-entry-index="${i}">Remove</button></div>`:""}
    </div>
   </div>`).join("") :
   `<div class="calendar-empty">Nothing has been noted or logged for this date yet.</div>`;
 o.innerHTML=`<div class="modal calendar-date-modal">
  <div class="modal-kicker">${day?`Training Day ${day.id}`:skipped?"PAUSED / NO CLASS":"Calendar"}</div>
  <h3>${label}</h3>
  <p>${skipped?`⏸️ ${status?scheduleStatusLabel(iso):"PAUSED"} — this date does not count toward your 55 training days.`:day?`Training Day ${day.id} of 55.`:"Weekend / non-training date."}</p>
  <div class="calendar-entries">${list}</div>
  <div class="modal-actions">
   <button type="button" class="secondary" id="closeCalendarDate">Close</button>
   ${skipped?'<button type="button" class="secondary" id="restoreTrainingDate">↩ Restore Training Day</button>':'<button type="button" class="secondary" id="pauseTrainingDate">⏸ Pause Day</button>'}
   <button type="button" class="primary" id="addCalendarDate">＋ Add to this date</button>
  </div>
 </div>`;
 addModalCloseX(o);o.classList.add("show");
 document.getElementById("closeCalendarDate").onclick=()=>o.classList.remove("show");
 document.getElementById("addCalendarDate").onclick=()=>{o.classList.remove("show");showQuickAddForm("activity",iso);};
 const pause=document.getElementById("pauseTrainingDate");
 if(pause) pause.onclick=()=>skipReasonPrompt(iso);
 const restore=document.getElementById("restoreTrainingDate");
 if(restore) restore.onclick=()=>restoreDate(iso);
 o.querySelectorAll(".entry-edit").forEach(btn=>btn.onclick=()=>{
   const entry=entries[Number(btn.dataset.entryIndex)];
   if(!entry)return;
   if(entry._dayNote) showEditDayNote(entry.dayId,iso);
   else if(entry.id) showEditQuickAdd(entry.id,iso);
 });
 o.querySelectorAll(".entry-delete").forEach(btn=>btn.onclick=()=>{
   const entry=entries[Number(btn.dataset.entryIndex)];
   if(!entry)return;
   if(entry._dayNote) removeDayNote(entry.dayId,iso);
   else if(entry.id) removeQuickAdd(entry.id,iso);
 });
}

  </div>
 </div>`;

 let fields=`<label class="field-label">Date<input id="editQaDate" type="date" value="${escHtml(item.date||iso)}"></label>`;
 if(item.type==="attendance"){
   fields+=`<label class="field-label">Status<select id="editQaStatus">
    ${["Present","Late","Absent","Excused"].map(v=>`<option ${String(item.value||"").split(" — ")[0]===v?"selected":""}>${v}</option>`).join("")}
   </select></label><label class="field-label">Notes<textarea id="editQaValue">${escHtml(String(item.value||"").replace(/^[^—]+ — /,""))}</textarea></label>`;
 }else if(item.type==="date"){
   fields+=`<label class="field-label">Title<input id="editQaTitle" value="${escHtml(item.title||"")}"></label>

 }else{
   fields+=`<label class="field-label">Title<input id="editQaTitle" value="${escHtml(item.title||"")}"></label>

   <label class="field-label">Attachment / Photo<input id="editQaAttachment" class="file-input" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv"></label>`;

 o.innerHTML=`<div class="modal">

  ${fields}
  <div class="modal-actions">
   <button type="button" class="secondary" id="cancelEditQa">Cancel</button>
   <button type="button" class="primary" id="saveEditQa">Save Changes</button>
  </div>
 </div>`;
 addModalCloseX(o);o.classList.add("show");
 document.getElementById("cancelEditQa").onclick=()=>openCalendarDate(iso);
 document.getElementById("saveEditQa").onclick=async()=>{const list=getQuickAdds(),idx=list.findIndex(x=>x.id===id);if(idx<0)return;const file=document.getElementById("editQaAttachment")?.files?.[0]||null;if(file&&file.size>6*1024*1024){showModal("Attachment too large","Please choose a file smaller than 6 MB.");return;}list[idx].date=document.getElementById("editQaDate").value||iso;list[idx].title=document.getElementById("editQaTitle")?.value||list[idx].title;list[idx].value=list[idx].type==="attendance"?((document.getElementById("editQaStatus")?.value||"Present")+(document.getElementById("editQaValue")?.value?" — "+document.getElementById("editQaValue").value:"")):(document.getElementById("editQaValue")?.value||document.getElementById("editQaStatus")?.value||"");if(file){try{const x=file.type.startsWith("image/")?await compressImageFile(file):await fileToDataUrl(file);list[idx].attachmentData=x.data;list[idx].attachmentName=x.name;}catch(e){showModal("Attachment error","The selected file could not be read.");return;}}list[idx].updatedAt=new Date().toISOString();try{localStorage.setItem("bloom55.quickAdds",JSON.stringify(list));}catch(e){showModal("Storage full","Try a smaller attachment.");return;}const newDate=list[idx].date;render();openCalendarDate(newDate);};
}

function removeQuickAdd(id,iso){
 const ok=confirm("Remove this saved item? This cannot be undone.");
 if(!ok)return;
 const list=getQuickAdds().filter(x=>x.id!==id);
 localStorage.setItem("bloom55.quickAdds",JSON.stringify(list));
 render();
 openCalendarDate(iso);
}

function calendarPanel(){
 const year=calendarCursor.getFullYear(), month=calendarCursor.getMonth();
 const days=trainingDays(), first=new Date(year,month,1), total=new Date(year,month+1,0).getDate();
 const monthName=calendarCursor.toLocaleDateString("en-US",{month:"long",year:"numeric"});
 let cells="";
 ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>cells+=`<div class="cal-cell head">${x}</div>`);
 for(let i=0;i<first.getDay();i++) cells+=`<div></div>`;
 for(let n=1;n<=total;n++){
   const d=new Date(year,month,n), iso=isoDate(d);
   const hit=days.find(x=>isoDate(x.date)===iso);
   const weekend=d.getDay()===0||d.getDay()===6;
   const skipped=isSkippedDate(iso);
   const logged=calendarEntriesForDate(iso).length>0;
   const marker=skipped?`<span class="pause-mark">⏸</span><span class="skip-label">${scheduleStatusLabel(iso)}</span>`:(logged?'<span class="date-dot"></span>':"");
   cells+=`<button type="button" class="cal-cell ${hit?"hit":""} ${weekend?"muted":""} ${skipped?"skipped":""} ${logged?"has-items":""}" data-date="${iso}" ${weekend?"disabled":""}>${n}${marker}</button>`;
 }
 return `<section class="schedule panel active"><div class="schedule-head">
   <div class="schedule-title"><div class="head-icon">${icon.cal}</div>Calendar</div>
   <div class="calendar-nav">
     <button class="month-arrow" id="prevMonth" aria-label="Previous month">‹</button>
     <div class="badge">${monthName}</div>
     <button class="month-arrow" id="nextMonth" aria-label="Next month">›</button>
   </div>
 </div>
 <div style="padding:24px">
   <div class="calendar-grid">${cells}</div>
   <div class="calendar-legend"><span><i class="legend-dot"></i> Saved information</span><span><i class="legend-pause">⏸</i> Paused / no class</span></div>
   <div class="empty-state">Tap a weekday to view its record. Use <b>Pause Day</b> when there is a holiday or no class.</div>
 </div></section>`;
}

 document.getElementById("saveDay").onclick=()=>{
   localStorage.setItem("bloom55.note."+d.id,document.getElementById("dayNote").value);
   o.classList.remove("show");
   render();
   if(active==="Calendar")openCalendarDate(iso);
   else showModal("Note saved","Your note will now appear when you tap this date in Calendar.");
 };
 document.getElementById("toggleDay").onclick=()=>{
   localStorage.setItem("bloom55.note."+d.id,document.getElementById("dayNote").value);
   if(completed.has(d.id))completed.delete(d.id);else completed.add(d.id);
   save();o.classList.remove("show");render();
 };
}
function addModalCloseX(o){
  const modal=o?.querySelector?.('.modal');
  if(!modal || modal.querySelector('.modal-x')) return;
  const x=document.createElement('button');
  x.type='button';
  x.className='modal-x';
  x.setAttribute('aria-label','Close');
  x.title='Close';
  x.textContent='×';
  x.onclick=()=>o.classList.remove('show');
  modal.prepend(x);
}

function closeQuickAdd(){
 const m=document.getElementById("quickAdd"), b=document.getElementById("fab");
 if(m){m.classList.remove("show");m.setAttribute("aria-hidden","true");}
 if(b)b.setAttribute("aria-expanded","false");
}
function toggleQuickAdd(){
 const m=document.getElementById("quickAdd"), b=document.getElementById("fab");
 if(!m)return;
 const open=!m.classList.contains("show");
 if(open){m.classList.add("show");m.setAttribute("aria-hidden","false");}
 else closeQuickAdd();
 if(b)b.setAttribute("aria-expanded",open?"true":"false");
}
function showQuickAddForm(type,presetDate=null){
 const labels={attendance:"Add attendance",activity:"Add training activity",note:"Add note",requirement:"Add requirement",date:"Add important date"};
 const o=document.getElementById("overlay");
 const dateValue=presetDate||isoDate(new Date());
 let fields=`<label class="field-label">Date<input id="qaDate" type="date" value="${dateValue}"></label>`;
 if(type==="attendance"){
   fields+=`<label class="field-label">Status<select id="qaStatus"><option>Present</option><option>Late</option><option>Absent</option><option>Excused</option></select></label><label class="field-label">Notes<textarea id="qaValue" placeholder="Optional attendance note"></textarea></label>`;
 }else if(type==="date"){
   fields+=`<label class="field-label">Title<input id="qaTitle" placeholder="e.g. Assessment / deadline / event"></label><label class="field-label">Notes<textarea id="qaValue" placeholder="Optional details"></textarea></label>`;
 }else{
   const ph=type==="activity"?"e.g. Bed making practice":type==="requirement"?"e.g. Training uniform / assignment":"e.g. What I learned today";
   fields+=`<label class="field-label">Title<input id="qaTitle" placeholder="${ph}"></label><label class="field-label">Details<textarea id="qaValue" placeholder="Add details..."></textarea></label><label class="field-label">Attachment / Photo<input id="qaAttachment" class="file-input" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv"></label><div id="qaAttachmentPreview" class="attachment-preview" hidden></div>`;
 }
 o.innerHTML=`<div class="modal"><div class="modal-kicker">Housekeeping NC II</div><h3>${labels[type]}</h3><p>This will appear immediately on the selected Calendar date.</p>${fields}<div class="modal-actions"><button type="button" class="secondary" id="qaCancel">Cancel</button><button type="button" class="primary" id="qaSave">Save</button></div></div>`;
 addModalCloseX(o);o.classList.add("show");
 document.getElementById("qaCancel").onclick=()=>o.classList.remove("show");
 const qaFile=document.getElementById("qaAttachment");
 if(qaFile)qaFile.onchange=()=>{const f=qaFile.files?.[0],p=document.getElementById("qaAttachmentPreview");if(f&&p){p.hidden=false;p.textContent="📎 "+f.name;}};
 document.getElementById("qaSave").onclick=async()=>{const list=getQuickAdds(),date=document.getElementById("qaDate").value||dateValue,file=qaFile?.files?.[0]||null;if(file&&file.size>6*1024*1024){showModal("Attachment too large","Please choose a file smaller than 6 MB.");return;}let attachmentData="",attachmentName="";if(file){try{const x=file.type.startsWith("image/")?await compressImageFile(file):await fileToDataUrl(file);attachmentData=x.data;attachmentName=x.name;}catch(e){showModal("Attachment error","The selected file could not be read.");return;}}list.push({id:Date.now(),type,title:document.getElementById("qaTitle")?.value||labels[type],value:document.getElementById("qaValue")?.value||document.getElementById("qaStatus")?.value||"",date,attachmentName,attachmentData,createdAt:new Date().toISOString()});try{localStorage.setItem("bloom55.quickAdds",JSON.stringify(list));}catch(e){showModal("Storage full","Try a smaller attachment.");return;}o.classList.remove("show");active="Calendar";calendarCursor=new Date(date+"T00:00:00");render();openCalendarDate(date);};
}

function parseNoteTasks(text){
  const raw=String(text||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const keywords=/\b(todo|to do|task|tasks|tomorrow|today|next|deadline|due|need to|remember|prepare|practice|assignment|submit|study|review|call|meeting|follow[- ]?up|post|send|finish|complete|work on|schedule)\b/i;
  return raw.filter(x=>keywords.test(x)).map(x=>x.replace(/^[-*•]\s*/,"")).slice(0,6);
}
function forecastDate(offset){
  const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+offset); return isoDate(d);
}
function forecastEntries(iso){
  const items=[], day=trainingDayForDate(iso);
  if(day){
    items.push({icon:"📚",title:`Housekeeping NC II — Training Day ${day.id}`,detail:"Scheduled training day"});
    parseNoteTasks(localStorage.getItem("bloom55.note."+day.id)||"").forEach(t=>items.push({icon:"📝",title:t,detail:"From your day note"}));
  }
  getQuickAdds().filter(x=>x.date===iso).slice(0,6).forEach(x=>items.push({icon:entryIcon(x.type),title:x.title||entryLabel(x.type),detail:x.value||entryLabel(x.type)}));
  parseNoteTasks(notes).forEach(t=>items.push({icon:"📌",title:t,detail:"From your Notes"}));
  return items.slice(0,8);
}
function taskForecast(){
  const todayIso=forecastDate(0), tomorrowIso=forecastDate(1);
  const todayItems=forecastEntries(todayIso), tomorrowItems=forecastEntries(tomorrowIso);
  const todayDay=trainingDayForDate(todayIso);
  const useTomorrow=!todayDay && tomorrowItems.length>0;
  const iso=useTomorrow?tomorrowIso:todayIso, items=useTomorrow?tomorrowItems:todayItems;
  const dateLabel=new Date(iso+"T00:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
  const title=useTomorrow?"Coming Up Tomorrow":"What You're About To Do";
  return `<section class="task-forecast">
    <div class="task-forecast-head"><div><div class="task-forecast-kicker">Smart Reminder</div><div class="task-forecast-title">${title}</div></div><div class="badge" style="font-size:13px;padding:8px 11px">${dateLabel}</div></div>
    <div class="task-forecast-list">${items.length?items.map(x=>`<div class="task-forecast-item"><span class="task-forecast-icon">${x.icon}</span><div><b>${escHtml(x.title)}</b><small>${escHtml(x.detail)}</small></div></div>`).join(""):`<div class="task-forecast-empty">No specific task is saved yet. Add a task, activity, requirement, or note with the + button and I'll surface it here.</div>`}</div>
    <div class="task-forecast-actions"><button class="task-forecast-btn" id="forecastAdd">＋ Add Task</button>${tomorrowItems.length?`<button class="task-forecast-btn secondary" id="forecastTomorrow">View Tomorrow</button>`:""}</div>
  </section>`;
}

function render(){
 setTheme();
 let content="";
 if(active==="Schedule") content=dashboard()+todayCard()+taskForecast()+schedule();
 if(active==="Progress") content=progressPanel();
 if(active==="Notes") content=notesPanel();
 if(active==="Calendar") content=calendarPanel();
 document.getElementById("app").innerHTML=`<main class="app"><header class="header"><div><div class="greeting">${greetingText()}</div><h1>Attendance Tracker</h1><div class="subtitle">Your TESDA training journey, one weekday at a time <span>💜</span></div></div><div class="top-actions">${profile.photo?`<img class="profile-photo" style="width:42px;height:42px" src="${profile.photo}" alt="Profile">`:``}<button class="icon-btn" id="themeBtn" aria-label="Toggle theme">${dark?icon.sun:icon.moon}</button><button class="icon-btn" id="settingsBtn" aria-label="Settings">${icon.gear}</button></div></header>${content}</main><button class="fab" id="fab" type="button" aria-label="Add / Log Training Activity" aria-expanded="false">${icon.plus}</button><div class="quick-add" id="quickAdd" aria-hidden="true"><div class="quick-add-title">Add / Log Training Activity</div><button type="button" class="quick-add-item" data-add="attendance"><span class="qa-icon">✓</span><span><b>Add attendance</b><small>Record present, late, absent or excused</small></span></button><button type="button" class="quick-add-item" data-add="activity"><span class="qa-icon">📋</span><span><b>Add training activity</b><small>Log what you practiced or completed</small></span></button><button type="button" class="quick-add-item" data-add="note"><span class="qa-icon">📝</span><span><b>Add note</b><small>Save a quick training note</small></span></button><button type="button" class="quick-add-item" data-add="requirement"><span class="qa-icon">📎</span><span><b>Add requirement</b><small>Track something to submit or prepare</small></span></button><button type="button" class="quick-add-item" data-add="date"><span class="qa-icon">📅</span><span><b>Add important date</b><small>Assessment, deadline or event</small></span></button></div>${nav()}`;
 
  const forecastAdd=document.getElementById("forecastAdd");
  if(forecastAdd) forecastAdd.onclick=()=>showQuickAddForm("activity",forecastDate(0));
  const forecastTomorrow=document.getElementById("forecastTomorrow");
  if(forecastTomorrow) forecastTomorrow.onclick=()=>{
    active="Calendar"; calendarCursor=new Date(forecastDate(1)+"T00:00:00"); render(); openCalendarDate(forecastDate(1));
  };

  document.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",(e)=>{
   const id=Number(b.dataset.day);
   if(b.dataset.detail){ e.preventDefault(); showDayDetail(id); return; }
   completed.has(id)?completed.delete(id):completed.add(id);save();render();
 }));
 const prevWeek=document.getElementById("prevWeek");
 if(prevWeek) prevWeek.onclick=()=>{scheduleWeekIndex--;render();};
 const nextWeek=document.getElementById("nextWeek");
 if(nextWeek) nextWeek.onclick=()=>{scheduleWeekIndex++;render();};
 const weekViewBtn=document.getElementById("weekViewBtn");
 if(weekViewBtn) weekViewBtn.onclick=()=>{scheduleView="week";render();};
 const listViewBtn=document.getElementById("listViewBtn");
 if(listViewBtn) listViewBtn.onclick=()=>{scheduleView="list";render();};
 document.querySelectorAll(".cal-cell[data-date]").forEach(b=>b.addEventListener("click",(e)=>{
   e.preventDefault();
   openCalendarDate(b.dataset.date);
 }));

 document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.nav;render();}));
 const prev=document.getElementById("prevMonth");
 if(prev) prev.onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1);render();};
 const nextMonth=document.getElementById("nextMonth");
 if(nextMonth) nextMonth.onclick=()=>{calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1);render();};
 document.getElementById("themeBtn").onclick=()=>{dark=!dark;render()};
 document.getElementById("settingsBtn").onclick=showSettings;
 const fab=document.getElementById("fab");
 if(fab) fab.onclick=(e)=>{e.preventDefault();e.stopPropagation();toggleQuickAdd();};
 document.querySelectorAll("[data-add]").forEach(b=>b.onclick=(e)=>{e.preventDefault();e.stopPropagation();closeQuickAdd();showQuickAddForm(b.dataset.add);});
 const saveNotes=document.getElementById("saveNotes"); if(saveNotes) saveNotes.onclick=()=>{notes=document.getElementById("notesBox").value;save();showModal("Notes saved","Your notes are stored on this device.");};
 const exp=document.getElementById("exportBtn"); if(exp) exp.onclick=exportData;
 const reset=document.getElementById("resetBtn"); if(reset) reset.onclick=()=>{if(confirm("Reset all Bloom55 progress and notes?")){completed=new Set();notes="";profile={name:"",role:"Housekeeping NC II Trainee",avatar:"🌸",photo:""};saveProfile();localStorage.removeItem("bloom55.quickAdds");localStorage.removeItem("bloom55.skippedDates");localStorage.removeItem("bloom55.scheduleAdjustments");save();active="Schedule";render();}};
}
function showModal(title,text){
 const o=document.getElementById("overlay");o.innerHTML=`<div class="modal"><h3>${title}</h3><p>${text}</p><div class="modal-actions"><button class="primary" id="closeModal">Close</button></div></div>`;addModalCloseX(o);o.classList.add("show");document.getElementById("closeModal").onclick=()=>o.classList.remove("show");
}
function showSettings(){
 const o=document.getElementById("overlay");
 const name=escHtml(profile.name||"");
 const role=escHtml(profile.role||"Housekeeping NC II Trainee");
 const avatar=escHtml(profile.avatar||"🌸");
 o.innerHTML=`<div class="modal">
   <div class="modal-kicker">Personalize Bloom55</div>
   <h3>⚙️ Settings</h3>
   <div class="settings-section-title">User Profile</div>
   <div class="profile-card">
     <div class="profile-avatar" id="profilePreview">${avatar}</div>
     <div><div class="profile-name">${escHtml(profileDisplayName())}</div><div class="profile-meta">${role}</div></div>
   </div>
   <label class="settings-field">Name
     <input id="profileName" maxlength="60" value="${name}" placeholder="Enter your name">
   </label>
   <label class="settings-field">Training / Role
     <input id="profileRole" maxlength="80" value="${role}" placeholder="e.g. Housekeeping NC II Trainee">
   </label>
   <label class="settings-field">Profile photo / icon
     <div class="profile-upload"><div id="profilePreview">${profile.photo?`<img class="profile-photo" src="${profile.photo}" alt="Profile photo">`:`<div class="profile-avatar">${avatar}</div>`}</div><div style="flex:1"><input id="profilePhoto" class="file-input" type="file" accept="image/*"><small>Upload a photo, or keep the icon below.</small></div></div>
   </label>
   <label class="settings-field">Profile icon
     <select id="profileAvatar">${["🌸","😊","👩","🧑","⭐","💜","🏆","📚"].map(x=>`<option value="${x}" ${x===avatar?"selected":""}>${x}</option>`).join("")}</select>
   </label>

   <div class="settings-section-title">More</div>
   <div class="settings-more-grid">
     <button type="button" class="settings-more-btn" id="settingsExport"><b>Export backup</b><small>Save your progress, notes, calendar entries and profile as JSON.</small></button>
     <button type="button" class="settings-more-btn" id="settingsReset"><b>Reset progress</b><small>Clear completed days, notes and saved calendar entries.</small></button>
   </div>

   <div class="settings-section-title">Appearance</div>
   <div class="settings-panel-row">
     <div><b>Night Mode</b><small>${dark?"Currently on":"Currently off"}</small></div>
     <button type="button" class="task-forecast-btn secondary" id="themeModal">${dark?"☀️ Light":"🌙 Night"}</button>
   </div>

   <div class="settings-actions">
     <button type="button" class="secondary" id="cancelSettings">Close</button>
     <button type="button" class="primary" id="saveProfile">Save Profile</button>
   </div>
 </div>`;
 addModalCloseX(o);o.classList.add("show");

 document.getElementById("cancelSettings").onclick=()=>o.classList.remove("show");
 let pendingProfilePhoto=profile.photo||"";
 document.getElementById("profileAvatar").onchange=e=>{if(!pendingProfilePhoto)document.getElementById("profilePreview").innerHTML=`<div class="profile-avatar">${escHtml(e.target.value)}</div>`;};
 document.getElementById("profilePhoto").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>8*1024*1024){showModal("Photo too large","Please choose a profile photo smaller than 8 MB.");e.target.value="";return;}try{const x=await compressImageFile(f,700,.82);pendingProfilePhoto=x.data;document.getElementById("profilePreview").innerHTML=`<img class="profile-photo" src="${x.data}" alt="Profile photo preview">`;}catch(err){showModal("Photo error","The selected photo could not be read.");}};
 document.getElementById("saveProfile").onclick=()=>{profile={name:document.getElementById("profileName").value.trim(),role:document.getElementById("profileRole").value.trim()||"Housekeeping NC II Trainee",avatar:document.getElementById("profileAvatar").value||"🌸",photo:pendingProfilePhoto};try{saveProfile();}catch(e){showModal("Profile not saved","Try a smaller photo.");return;}o.classList.remove("show");render();};
 document.getElementById("themeModal").onclick=()=>{
   dark=!dark;
   setTheme();
   showSettings();
 };
 document.getElementById("settingsExport").onclick=exportData;
 document.getElementById("settingsReset").onclick=()=>{
   if(confirm("Reset all Bloom55 progress, notes and saved calendar entries?")){
     completed=new Set();notes="";
     localStorage.removeItem("bloom55.quickAdds");
     localStorage.removeItem("bloom55.skippedDates");
     localStorage.removeItem("bloom55.scheduleAdjustments");
     for(let i=1;i<=TOTAL;i++) localStorage.removeItem("bloom55.note."+i);
     save();
     o.classList.remove("show");
     active="Schedule";
     render();
   }
 };
}

function exportData(){
 const blob=new Blob([JSON.stringify({app:"Bloom55",start:"2026-08-10",completed:[...completed].sort((a,b)=>a-b),notes,quickAdds:getQuickAdds(),skippedDates:getSkippedDates(),scheduleAdjustments:JSON.parse(localStorage.getItem("bloom55.scheduleAdjustments")||"{}"),profile},null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bloom55-backup.json";a.click();URL.revokeObjectURL(a.href);
}
document.addEventListener("click",(e)=>{const m=document.getElementById("quickAdd"),b=document.getElementById("fab");if(m&&m.classList.contains("show")&&!m.contains(e.target)&&e.target!==b)closeQuickAdd();});
document.addEventListener("keydown",(e)=>{if(e.key==="Escape")closeQuickAdd();});
render();

</script>
